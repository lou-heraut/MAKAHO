[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "makaho"
version = "2.0.0.dev0"
description = "Carte des tendances hydrologiques des stations de référence françaises, calculées par card-api"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [{name = "Louis Héraut", email = "louis.heraut@inrae.fr"}]
dependencies = [
    "flask>=3",
    # Le client HTTP de card_client.py. Celui de card-api aussi, et son
    # MockTransport permet des tests hors ligne sans autre dépendance.
    "httpx>=0.27",
]

# ruff épinglé ici seulement, au même numéro que card, stase et card-api :
# un lint ne sert que s'il rend le même verdict partout. python-dotenv
# fait lire `.env` à `flask run` ; en production, l'environnement vient
# du gestionnaire de services.
[project.optional-dependencies]
dev = ["pytest", "python-dotenv", "ruff==0.15.22"]
# scripts/mesure_sampling.py : la mesure B refait VCN10 en local avec
# stase, parce que card, donc card-api, refuse une fenêtre partielle.
measure = ["numpy", "pandas", "python-dotenv", "stase"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
makaho = ["templates/*.html", "station_lists/*.txt", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Jeu de règles déclaré, le même que dans les trois autres dépôts.
[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
