<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MAKAHO</title>
  <meta name="description" content="Tendances des débits des cours d'eau français peu influencés par l'homme : test de Mann-Kendall et pente de Sen sur les stations du RRSE.">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/leaflet-1.9.4/leaflet.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/makaho.css') }}">
</head>
<body>
  <!-- Les symboles des stations, dans un repère de 24 unités dessiné en
       32 px : les mesures de la 1.0.0 (dev/audits/2026-11-11_v1-interface.md).
       Chaque station les reprend par <use>, l'export de carte (M6) aussi. -->
  <svg class="sprite" aria-hidden="true">
    <symbol id="m-down" viewBox="0 0 24 24"><polygon points="12,19.77 20.81,4.51 3.19,4.51"/></symbol>
    <symbol id="m-up" viewBox="0 0 24 24"><polygon points="12,4.23 20.81,19.49 3.19,19.49"/></symbol>
    <symbol id="m-none" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.83"/></symbol>
    <symbol id="m-short" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.98"/></symbol>
  </svg>

  <div id="map" aria-label="Carte des stations"></div>

  <button id="recenter" class="button small tip-host" type="button" hidden
          aria-label="Recentrer la carte sur la France">
    {% include "icons/center_focus_strong.svg" %}
    <span class="tip">Recentrer la carte sur la France</span>
  </button>

  <div id="legend">
    <section id="summary" class="panel light docked" hidden aria-label="Ce que montre la carte">
      <h1 id="card-id"></h1>
      <p id="card-name" class="name"></p>
      <p id="card-sampling"></p>
      <p id="card-period"></p>
      <p id="card-level"></p>
    </section>

    <section id="colorbar" class="panel light docked" hidden aria-label="Échelle de couleur des pentes"></section>

    <section id="counts" class="panel light docked" hidden aria-label="Compteurs"></section>
  </div>

  <button id="info-button" class="logo-button tip-host" type="button"
          aria-label="À propos de MAKAHO" aria-expanded="false" aria-controls="info">
    {% include "icons/inrae.svg" %}
    <span class="tip">À propos de MAKAHO</span>
  </button>

  <section id="info" class="panel dark" hidden aria-label="À propos de MAKAHO">
    <dl>
      <dt>Contact</dt>
      <dd><a href="mailto:contact.makaho@listes.inrae.fr">contact.makaho@listes.inrae.fr</a></dd>
      <dt>Développeur</dt>
      <dd>Lou Héraut</dd>
      <dt>Référent</dt>
      <dd>Michel Lang</dd>
      <dt>Jeu de données</dt>
      <dd><a href="https://entrepot.recherche.data.gouv.fr/dataset.xhtml?persistentId=doi:10.57745/LNBEGZ">Recherche Data Gouv</a></dd>
      <dt>Code source</dt>
      <dd><a href="https://github.com/lou-heraut/MAKAHO">GitHub</a></dd>
      <dt>Interface</dt>
      <dd>inspirée de <a href="https://earth.nullschool.net/">earth.nullschool.net</a></dd>
      <dt>Débits</dt>
      <dd id="info-data"><a href="https://hubeau.eaufrance.fr/">Hub'Eau</a></dd>
      <dt>Calcul</dt>
      <dd id="info-compute"><a href="https://card-api.riverly.inrae.fr/">card-api</a></dd>
    </dl>
  </section>

  <div id="status" class="panel dark status" role="status">
    <span class="ring" aria-hidden="true"></span>
    <span id="status-text">Calcul des tendances…</span>
  </div>

  <script src="{{ url_for('static', filename='vendor/leaflet-1.9.4/leaflet.js') }}"></script>
  <script src="{{ url_for('static', filename='js/makaho.js') }}"></script>
</body>
</html>
